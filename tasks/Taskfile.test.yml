version: "3"

tasks:
  default:
    cmds:
      - task --list --taskfile ./tasks/Taskfile.test.yml

  unit:
    desc: Run all unit and contract tests (no live Azure dependencies)
    cmds:
      - dotnet test tests/BankingAgent.Domain.Tests --configuration Release --logger "console;verbosity=normal"
      - dotnet test tests/BankingAgent.Application.Tests --configuration Release --logger "console;verbosity=normal"
      - dotnet test tests/BankingAgent.Api.Tests --configuration Release --filter Category!=E2E --logger "console;verbosity=normal"
      - dotnet test tests/BankingAgent.WebUi.Tests --configuration Release --logger "console;verbosity=normal"
      - dotnet test tests/BankingAgent.Infrastructure.Tests --configuration Release --logger "console;verbosity=normal"

  domain:
    desc: Run WorkflowRoutingPolicy unit tests only
    cmds:
      - dotnet test tests/BankingAgent.Domain.Tests --configuration Release --logger "console;verbosity=normal"

  application:
    desc: Run WorkflowService and repository contract tests
    cmds:
      - dotnet test tests/BankingAgent.Application.Tests --configuration Release --logger "console;verbosity=normal"

  api:
    desc: Run orchestrator endpoint and authentication contract tests
    cmds:
      - dotnet test tests/BankingAgent.Api.Tests --configuration Release --filter Category!=E2E --logger "console;verbosity=normal"

  webui:
    desc: Run Web UI token handler contract tests
    cmds:
      - dotnet test tests/BankingAgent.WebUi.Tests --configuration Release --logger "console;verbosity=normal"

  infrastructure:
    desc: Run EF repository, MCP reliability, and seed contract tests
    cmds:
      - dotnet test tests/BankingAgent.Infrastructure.Tests --configuration Release --logger "console;verbosity=normal"

  e2e:
    desc: Run API/UI E2E tests with real EF repositories on system SQLite
    cmds:
      - |
        discovered=$(dotnet test tests/BankingAgent.Api.Tests \
          --configuration Release --filter Category=E2E --list-tests)
        echo "$discovered"
        grep -q "WorkflowE2eTests" <<< "$discovered"
      - dotnet test tests/BankingAgent.Api.Tests
        --configuration Release
        --filter Category=E2E
        --logger "console;verbosity=normal"

  hosted:
    desc: Run Python hosted-agent HTTP boundary tests
    dir: src/agents/python
    cmds:
      - python -m pip install -r requirements.txt -r requirements-dev.txt -q
      - python -m pytest tests/test_hosted.py -v

  python-agents:
    desc: Run Python agent unit tests
    cmds:
      - python -m pip install -r src/agents/python/requirements.txt -r src/agents/python/requirements-dev.txt -q
      - cd src/agents/python && python -m pytest tests -v

  python-deployer:
    desc: Run Python deployer unit tests
    cmds:
      - python -m pip install -r src/agents/deployer/requirements.txt pytest -q
      - cd src/agents/deployer && python -m pytest test_deploy.py -v

  scripts:
    desc: Run deployment script tests (smoke assertions and agent feature flags)
    cmds:
      - python -m pip install pytest -q
      - python -m pytest scripts/tests -v

  js:
    desc: Run WebUI browser/DOM regression tests (jsdom, no headless browser binary)
    dir: tests/webui-js
    cmds:
      - npm ci --prefer-offline
      - node --test


  all:
    desc: Aggregate quality gate — unit, E2E, Python, and script tests (no live Azure)
    cmds:
      - task: unit
      - task: js
      - task: e2e
      - task: python-agents
      - task: python-deployer
      - task: hosted
      - task: scripts
