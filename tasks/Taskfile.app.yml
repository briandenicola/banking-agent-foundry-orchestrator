version: "3"

vars:
  COMMIT_VERSION:
    sh: git rev-parse HEAD | cut -c 1-8

tasks:
  default:
    cmds:
      - task --list --taskfile ./tasks/Taskfile.app.yml

  init:
    desc: Initialize the application Terraform stack
    cmds:
      - bash ./scripts/guard-local-terraform-state.sh apps
      - |
        set -e
        if [ -n "{{.TF_BACKEND_RESOURCE_GROUP}}" ] || [ -n "{{.TF_BACKEND_STORAGE_ACCOUNT}}" ] || [ -n "{{.TF_BACKEND_CONTAINER}}" ] || [ -n "{{.TF_STATE_ENVIRONMENT}}" ]; then
          if [ -z "{{.TF_BACKEND_RESOURCE_GROUP}}" ] || [ -z "{{.TF_BACKEND_STORAGE_ACCOUNT}}" ] || [ -z "{{.TF_BACKEND_CONTAINER}}" ] || [ -z "{{.TF_STATE_ENVIRONMENT}}" ]; then
            echo "Remote state is partially configured. Provide all TF_BACKEND_RESOURCE_GROUP, TF_BACKEND_STORAGE_ACCOUNT, TF_BACKEND_CONTAINER, and TF_STATE_ENVIRONMENT or leave them blank to use local state."
            exit 1
          fi

          terraform -chdir=./apps init -reconfigure -input=false \
            -backend-config="resource_group_name={{.TF_BACKEND_RESOURCE_GROUP}}" \
            -backend-config="storage_account_name={{.TF_BACKEND_STORAGE_ACCOUNT}}" \
            -backend-config="container_name={{.TF_BACKEND_CONTAINER}}" \
            -backend-config="key={{.TF_STATE_ENVIRONMENT}}/apps.tfstate"
        else
          terraform -chdir=./apps init -reconfigure -input=false
        fi

        terraform -chdir=./apps validate

  build:
    desc: Build and push all application images to ACR
    cmds:
      - task: build-orchestrator
      - task: build-webui
      - task: build-hosted-agents
      - task: build-agent-deployer
      - task: build-database-migrator

  build-orchestrator:
    desc: Build and push the orchestrator image to ACR
    cmds:
      - az acr build
        --registry {{.ACR_NAME}}
        --image orchestrator:{{.COMMIT_VERSION}}
        --image orchestrator:latest
        --file src/orchestrator/Dockerfile .
    vars:
      ACR_NAME:
        sh: terraform -chdir=./infrastructure output -raw ACR_NAME
      COMMIT_VERSION: { sh: "git rev-parse HEAD | cut -c 1-8" }

  build-webui:
    desc: Build and push the web UI image to ACR
    cmds:
      - az acr build
        --registry {{.ACR_NAME}}
        --image webui:{{.COMMIT_VERSION}}
        --image webui:latest
        --file src/webui/Dockerfile .
    vars:
      ACR_NAME:
        sh: terraform -chdir=./infrastructure output -raw ACR_NAME
      COMMIT_VERSION:
        sh: git rev-parse HEAD | cut -c 1-8

  build-agents:
    desc: Build and push the local Python agent compatibility image to ACR
    cmds:
      - az acr build
        --registry {{.ACR_NAME}}
        --image agents:{{.COMMIT_VERSION}}
        --image agents:latest
        --file src/agents/python/Dockerfile .
    vars:
      ACR_NAME:
        sh: terraform -chdir=./infrastructure output -raw ACR_NAME
      COMMIT_VERSION:
        sh: git rev-parse HEAD | cut -c 1-8

  build-hosted-agents:
    desc: Build and push the Foundry Hosted Agent runtime image to ACR
    cmds:
      - az acr build
        --registry {{.ACR_NAME}}
        --image hosted-agents:{{.COMMIT_VERSION}}
        --image hosted-agents:latest
        --file src/agents/python/Dockerfile.hosted .
    vars:
      ACR_NAME:
        sh: terraform -chdir=./infrastructure output -raw ACR_NAME
      COMMIT_VERSION:
        sh: git rev-parse HEAD | cut -c 1-8

  build-agent-deployer:
    desc: Build and push the managed-identity Hosted Agent deployer image to ACR
    cmds:
      - az acr build
        --registry {{.ACR_NAME}}
        --image agent-deployer:{{.COMMIT_VERSION}}
        --image agent-deployer:latest
        --file src/agents/deployer/Dockerfile .
    vars:
      ACR_NAME:
        sh: terraform -chdir=./infrastructure output -raw ACR_NAME
      COMMIT_VERSION:
        sh: git rev-parse HEAD | cut -c 1-8

  build-database-migrator:
    desc: Build and push the managed-identity PostgreSQL migration image to ACR
    cmds:
      - az acr build
        --registry {{.ACR_NAME}}
        --image database-migrator:{{.COMMIT_VERSION}}
        --image database-migrator:latest
        --file src/database-migrator/Dockerfile .
    vars:
      ACR_NAME:
        sh: terraform -chdir=./infrastructure output -raw ACR_NAME
      COMMIT_VERSION:
        sh: git rev-parse HEAD | cut -c 1-8

  apply:
    desc: Deploy the application Container Apps
    cmds:
      - |
        set -e
        if [ -n "{{.TF_BACKEND_RESOURCE_GROUP}}" ] || [ -n "{{.TF_BACKEND_STORAGE_ACCOUNT}}" ] || [ -n "{{.TF_BACKEND_CONTAINER}}" ] || [ -n "{{.TF_STATE_ENVIRONMENT}}" ]; then
          if [ -z "{{.TF_BACKEND_RESOURCE_GROUP}}" ] || [ -z "{{.TF_BACKEND_STORAGE_ACCOUNT}}" ] || [ -z "{{.TF_BACKEND_CONTAINER}}" ] || [ -z "{{.TF_STATE_ENVIRONMENT}}" ]; then
            echo "Remote state is partially configured. Provide all TF_BACKEND_RESOURCE_GROUP, TF_BACKEND_STORAGE_ACCOUNT, TF_BACKEND_CONTAINER, and TF_STATE_ENVIRONMENT or leave them blank to use local state."
            exit 1
          fi

          terraform -chdir=./apps init -reconfigure -input=false \
            -backend-config="resource_group_name={{.TF_BACKEND_RESOURCE_GROUP}}" \
            -backend-config="storage_account_name={{.TF_BACKEND_STORAGE_ACCOUNT}}" \
            -backend-config="container_name={{.TF_BACKEND_CONTAINER}}" \
            -backend-config="key={{.TF_STATE_ENVIRONMENT}}/apps.tfstate"
        else
          terraform -chdir=./apps init -reconfigure -input=false
        fi

        terraform -chdir=./apps apply -compact-warnings \
          -var "app_name={{.APP_NAME}}" \
          -var "region={{.REGION}}" \
          -var "enable_service_auth={{.ENABLE_SERVICE_AUTH}}" \
          -var "allow_insecure_service_auth={{.ALLOW_INSECURE_SERVICE_AUTH}}" \
          -var "image_tag={{.COMMIT_VERSION}}"
    vars:
      APP_NAME:
        sh: terraform -chdir=./infrastructure output -raw APP_NAME
      REGION: '{{default "swedencentral" .CLI_ARGS}}'
      ENABLE_SERVICE_AUTH: '{{default "true" .ENABLE_SERVICE_AUTH}}'
      ALLOW_INSECURE_SERVICE_AUTH: '{{default "false" .ALLOW_INSECURE_SERVICE_AUTH}}'

  deploy:
    desc: Deploy the application stack and register Foundry Hosted Agents
    cmds:
      - task: apply
      - task: migrate
      - task: deploy-hosted-agents

  deploy-hosted-agents:
    desc: Run the Container Apps Job that registers and versions all Hosted Agents
    cmds:
      - bash ./scripts/deploy-hosted-agents.sh

  migrate:
    desc: Run the managed-identity PostgreSQL migration job
    cmds:
      - bash ./scripts/migrate-database.sh

  smoke:
    desc: Run the deployed MVP health, Hosted Agent, workflow, and approval checks
    cmds:
      - python ./scripts/smoke-mvp.py {{.CLI_ARGS}}

  destroy:
    desc: Destroy the application Container Apps
    cmds:
      - |
        set -e
        if [ -n "{{.TF_BACKEND_RESOURCE_GROUP}}" ] || [ -n "{{.TF_BACKEND_STORAGE_ACCOUNT}}" ] || [ -n "{{.TF_BACKEND_CONTAINER}}" ] || [ -n "{{.TF_STATE_ENVIRONMENT}}" ]; then
          if [ -z "{{.TF_BACKEND_RESOURCE_GROUP}}" ] || [ -z "{{.TF_BACKEND_STORAGE_ACCOUNT}}" ] || [ -z "{{.TF_BACKEND_CONTAINER}}" ] || [ -z "{{.TF_STATE_ENVIRONMENT}}" ]; then
            echo "Remote state is partially configured. Provide all TF_BACKEND_RESOURCE_GROUP, TF_BACKEND_STORAGE_ACCOUNT, TF_BACKEND_CONTAINER, and TF_STATE_ENVIRONMENT or leave them blank to use local state."
            exit 1
          fi

          terraform -chdir=./apps init -reconfigure -input=false \
            -backend-config="resource_group_name={{.TF_BACKEND_RESOURCE_GROUP}}" \
            -backend-config="storage_account_name={{.TF_BACKEND_STORAGE_ACCOUNT}}" \
            -backend-config="container_name={{.TF_BACKEND_CONTAINER}}" \
            -backend-config="key={{.TF_STATE_ENVIRONMENT}}/apps.tfstate"
        else
          terraform -chdir=./apps init -reconfigure -input=false
        fi

        terraform -chdir=./apps destroy -compact-warnings \
          -var "app_name={{.APP_NAME}}" \
          -var "region={{.REGION}}" \
          -var "image_tag={{.COMMIT_VERSION}}"
    vars:
      APP_NAME:
        sh: terraform -chdir=./infrastructure output -raw APP_NAME
      REGION: '{{default "swedencentral" .CLI_ARGS}}'
      COMMIT_VERSION:
        sh: git rev-parse HEAD | cut -c 1-8
