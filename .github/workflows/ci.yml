# Continuous integration: validates every pull request and every push to main or beta.
# Does NOT deploy or push images; publishing happens only in deploy-production.yml,
# which runs only for CI runs whose head_branch is main. Pushes to beta are therefore
# tested but never deployed.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── .NET build and unit tests ──────────────────────────────────────────────
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore banking-agent.sln

      - name: Build (Release)
        run: dotnet build banking-agent.sln --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format banking-agent.sln --verify-no-changes --no-restore

      - name: Unit tests – Domain
        run: >
          dotnet test tests/BankingAgent.Domain.Tests
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=domain.trx"

      - name: Unit tests – Application
        run: >
          dotnet test tests/BankingAgent.Application.Tests
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=application.trx"

      - name: API integration tests
        run: >
          dotnet test tests/BankingAgent.Api.Tests
          --configuration Release --no-build
          --filter Category!=E2E
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=api.trx"

      - name: Unit tests – WebUI
        run: >
          dotnet test tests/BankingAgent.WebUi.Tests
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=webui.trx"

      - name: WebUI JS browser/DOM regression tests
        working-directory: tests/webui-js
        run: |
          npm ci
          node --test


      - name: Persistence and infrastructure integration tests
        run: >
          dotnet test tests/BankingAgent.Infrastructure.Tests
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=infrastructure.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/*.trx"

  # ── E2E lifecycle tests (Category=E2E, in-process WebApplicationFactory) ──
  dotnet-e2e:
    name: .NET E2E tests
    runs-on: ubuntu-latest
    # E2E tests depend on SQLite via Microsoft.Data.Sqlite; the ubuntu-latest
    # runner ships libsqlite3 already. No Azure credentials are required.
    needs: dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore banking-agent.sln

      - name: Build (Release)
        run: dotnet build banking-agent.sln --configuration Release --no-restore

      - name: E2E tests (Category=E2E)
        run: >
          dotnet test tests/BankingAgent.Api.Tests
          --configuration Release --no-build
          --filter Category=E2E
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=e2e.trx"

      - name: Verify E2E test discovery
        shell: bash
        run: |
          discovered=$(dotnet test tests/BankingAgent.Api.Tests \
            --configuration Release --no-build \
            --filter Category=E2E --list-tests)
          echo "$discovered"
          grep -q "WorkflowE2eTests" <<< "$discovered"

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-e2e-results
          path: "**/*.trx"

  # ── Python agent syntax check ──────────────────────────────────────────────
  python-agents:
    name: Python agent syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall src/agents/python


  # ── Python agent unit tests ────────────────────────────────────────────────
  python-agent-tests:
    name: Python agent unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent dependencies
        run: |
          python -m pip install -r src/agents/python/requirements.txt \
            -r src/agents/python/requirements-dev.txt

      - name: Run agent tests
        # Runs the whole suite so new test modules are covered without editing CI.
        working-directory: src/agents/python
        run: python -m pytest tests -v

  # ── Python hosted-agent contract tests ────────────────────────────────────
  python-hosted-tests:
    name: Python hosted-agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent dependencies
        run: |
          python -m pip install -r src/agents/python/requirements.txt \
            -r src/agents/python/requirements-dev.txt

      - name: Run hosted-agent tests
        # Working directory is required: app imports are relative to src/agents/python.
        # Runs pytest directly; fails if tests/test_hosted.py is missing.
        working-directory: src/agents/python
        run: python -m pytest tests/test_hosted.py -v

  # ── Python deployer unit tests ─────────────────────────────────────────────
  python-deployer-tests:
    name: Python deployer unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deployer dependencies
        run: python -m pip install -r src/agents/deployer/requirements.txt pytest

      - name: Run deployer tests
        working-directory: src/agents/deployer
        run: python -m pytest test_deploy.py -v

  # ── Web UI: browser/DOM regression tests ──────────────────────────────────
  webui-js-tests:
    name: Web UI DOM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/webui-js/package-lock.json

      - name: Install dependencies
        working-directory: tests/webui-js
        run: npm ci --prefer-offline

      - name: Run DOM tests
        working-directory: tests/webui-js
        run: node --test

  # ── Python: deployment script tests ───────────────────────────────────────
  script-tests:
    name: Deployment script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install pytest

      # Guards the smoke script and the optional agent feature flags.
      # ADRs 0003 and 0004 cite these tests; they must run on every change.
      - name: Run script tests
        run: python -m pytest scripts/tests -v

  # ── Terraform: infrastructure stack ───────────────────────────────────────
  terraform-infrastructure:
    name: Terraform validate (infrastructure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.8'

      - name: fmt check
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: init (no backend)
        run: terraform -chdir=infrastructure init -backend=false -input=false

      - name: validate
        run: terraform -chdir=infrastructure validate

  # ── Terraform: apps stack ──────────────────────────────────────────────────
  terraform-apps:
    name: Terraform validate (apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.8'

      - name: fmt check
        run: terraform -chdir=apps fmt -check -recursive

      - name: init (no backend)
        run: terraform -chdir=apps init -backend=false -input=false

      - name: validate
        # Supply dummy required variables so that validate can complete without
        # real infrastructure outputs being available.
        env:
          TF_VAR_app_name: ci-validation-placeholder
        run: terraform -chdir=apps validate

  # ── Container image builds ─────────────────────────────────────────────────
  # All seven deployable images are built to verify Dockerfiles stay valid.
  # Images are NOT pushed; push is gated to deploy-production.yml.
  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: orchestrator
            dockerfile: src/orchestrator/Dockerfile
            tag: banking-agent-orchestrator:ci
          - name: webui
            dockerfile: src/webui/Dockerfile
            tag: banking-agent-webui:ci
          - name: agents-python
            dockerfile: src/agents/python/Dockerfile
            tag: banking-agent-agents:ci
          - name: agents-hosted
            dockerfile: src/agents/python/Dockerfile.hosted
            tag: banking-agent-hosted-agents:ci
          - name: agent-deployer
            dockerfile: src/agents/deployer/Dockerfile
            tag: banking-agent-agent-deployer:ci
          - name: database-migrator
            dockerfile: src/database-migrator/Dockerfile
            tag: banking-agent-database-migrator:ci
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }}
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ matrix.tag }} \
            --label "git.sha=${{ github.sha }}" \
            .

      - name: Verify image
        run: docker image inspect ${{ matrix.tag }} --format '{{ .RepoTags }} {{ .Created }}'
