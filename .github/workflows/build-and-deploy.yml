name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'
      - name: Restore solution
        run: dotnet restore banking-agent.sln
      - name: Build solution
        run: dotnet build banking-agent.sln --configuration Release --no-restore
      - name: Terraform fmt check
        run: terraform -chdir=infrastructure fmt -check -recursive
      - name: Terraform init
        run: terraform -chdir=infrastructure init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infrastructure validate
      - name: Build orchestrator container
        run: docker build -f src/orchestrator/Dockerfile -t banking-agent-orchestrator:test .
      - name: Build UI container
        run: docker build -f src/webui/Dockerfile -t banking-agent-webui:test .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.AZURE_CREDENTIALS != ''
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'
      - name: Terraform init
        run: terraform -chdir=infrastructure init -input=false
      - name: Terraform apply
        env:
          ARM_USE_OIDC: false
          ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
          ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
        run: terraform -chdir=infrastructure apply -auto-approve -input=false
